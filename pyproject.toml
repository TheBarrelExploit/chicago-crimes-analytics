[project]
name = "chicago-crimes-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.19",
    "duckdb>=1.5.3",
    "evidently>=0.7.21",
    "fastapi[standard]>=0.136.3",
    "mlflow>=3.13.0",
    "optuna>=4.9.0",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.14.1",
    "pydeck>=0.9.2",
    "scikit-learn>=1.8.0",
    "streamlit>=1.58.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]