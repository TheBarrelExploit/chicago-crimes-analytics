[project]
name = "chicago-crimes-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.19",
    "dagshub>=0.7.0",
    "duckdb>=1.5.3",
    "evidently>=0.7.21",
    "fastapi[standard]>=0.136.3",
    "mlflow>=3.13.0",
    "modal>=1.5.1",
    "optuna>=4.9.0",
    "plotly>=5.24.1",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.14.1",
    "pydeck>=0.9.2",
    "scikit-learn>=1.8.0",
    "streamlit>=1.58.0",
    "streamlit-option-menu>=0.4.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.22",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]


[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # Pyflakes
    "B",           # flake8-bugbear
    "I",           # isort
    "UP",          # pyupgrade (Python 3.13)
    "N",           # pep8-naming
    "ASYNC",       # async/await
    "C4",          # comprehensions
    "SIM",         # simplify
    "RET",         # returns
    "ARG",         # arguments
    "PTH",         # pathlib
    "D",
]
ignore = ["E501"]  # maneja las líneas ruff format

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401","D104"]
"src/dashboard/app.py" = ["E402", "I001"]
"tests/**/*.py" = [
    "E402",
    "S101",        # assert en tests
    "ARG001",      # argumentos no usados en fixtures
    "PLR2004",     # números mágicos
    "D100", 
    "D101", 
    "D102", 
    "D103",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
# Corregido: addopts optimizado para terminal local ágil. Apunta directo a src
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=src",              # Escanea solo tu código fuente real, no carpetas basura
    "--cov-report=term-missing" # Muestra en consola qué líneas faltan por probar
]
[tool.ruff.lint.pydocstyle]
convention = "google"
